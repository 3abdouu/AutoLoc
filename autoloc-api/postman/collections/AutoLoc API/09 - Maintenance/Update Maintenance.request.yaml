$kind: http-request
method: PUT
url: '{{base_url}}/maintenances/{{idMaintenance}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-11-10",
      "dateFin": "2026-11-12",
      "description": "Vidange, filtres et plaquettes de frein",
      "vehicule": { "idVehicule": {{idVehicule}} }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Maintenance modifié(e)", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().idMaintenance).to.eql(Number(pm.collectionVariables.get("idMaintenance")));
      });
