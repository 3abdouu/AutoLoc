$kind: http-request
method: POST
url: '{{base_url}}/vehicules'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "immatriculation": "{{$randomInt}} TUN {{$randomInt}}",
      "marque": "Peugeot",
      "modele": "208",
      "categorie": "CITADINE",
      "tarifJournalier": 85.00,
      "statut": "DISPONIBLE",
      "agence": { "idAgence": {{idAgence}} },
      "equipements": [ { "idEquipement": {{idEquipement}} } ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Vehicule créé(e) avec un id", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().idVehicule).to.be.a("number");
      });
      pm.collectionVariables.set("idVehicule", pm.response.json().idVehicule);
