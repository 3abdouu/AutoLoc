$kind: http-request
method: GET
url: '{{base_url}}/vehicules'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Liste des vehicules non vide", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.be.an("array").that.is.not.empty;
      });
