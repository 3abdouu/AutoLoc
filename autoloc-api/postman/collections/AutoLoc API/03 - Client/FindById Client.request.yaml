$kind: http-request
method: GET
url: '{{base_url}}/clients/{{idClient}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Client trouvé(e) par id", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().idClient).to.eql(Number(pm.collectionVariables.get("idClient")));
      });
