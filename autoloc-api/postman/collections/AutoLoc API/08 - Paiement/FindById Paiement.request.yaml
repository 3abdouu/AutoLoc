$kind: http-request
method: GET
url: '{{base_url}}/paiements/{{idPaiement}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Paiement trouvé(e) par id", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().idPaiement).to.eql(Number(pm.collectionVariables.get("idPaiement")));
      });
