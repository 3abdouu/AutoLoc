$kind: http-request
method: POST
url: '{{base_url}}/paiements'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "montant": 200.00,
      "datePaiement": "2026-11-30",
      "modePaiement": "CARTE",
      "contrat": { "idContrat": {{idContrat}} }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Paiement créé(e) avec un id", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().idPaiement).to.be.a("number");
      });
      pm.collectionVariables.set("idPaiement", pm.response.json().idPaiement);
