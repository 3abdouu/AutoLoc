$kind: http-request
method: POST
url: '{{base_url}}/equipements'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "libelle": "GPS {{$randomInt}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Equipement créé(e) avec un id", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().idEquipement).to.be.a("number");
      });
      pm.collectionVariables.set("idEquipement", pm.response.json().idEquipement);
