$kind: http-request
method: POST
url: '{{base_url}}/contrats'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "dateSignature": "2026-11-30",
      "montantTotal": 340.00,
      "valide": false,
      "reservation": { "idReservation": {{idReservation}} }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Contrat créé(e) avec un id", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().idContrat).to.be.a("number");
      });
      pm.collectionVariables.set("idContrat", pm.response.json().idContrat);
