$kind: http-request
method: GET
url: '{{base_url}}/contrats/{{idContrat}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Contrat trouvé(e) par id", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().idContrat).to.eql(Number(pm.collectionVariables.get("idContrat")));
      });
