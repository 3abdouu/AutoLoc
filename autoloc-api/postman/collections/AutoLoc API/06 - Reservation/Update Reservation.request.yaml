$kind: http-request
method: PUT
url: '{{base_url}}/reservations/{{idReservation}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-12-01",
      "dateFin": "2026-12-07",
      "statut": "CONFIRMEE",
      "vehicule": { "idVehicule": {{idVehicule}} },
      "client": { "idClient": {{idClient}} }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Reservation modifié(e)", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().idReservation).to.eql(Number(pm.collectionVariables.get("idReservation")));
      });
